<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MB World — 서비스매니저 라운지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f12;--panel:#16181d;--line:#2a2d35;--txt:#e9ebef;--sub:#9aa0aa;--acc:#00adef;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0 320px 0 0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;outline:none}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;background:rgba(15,16,20,.78);color:#fff;border-radius:8px;padding:3px 9px 4px;font-size:12px;font-weight:700;line-height:1.3}
.tag small{display:block;font-size:10px;font-weight:500;opacity:.72}
.tag.me{background:rgba(0,120,170,.9)}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:210px;background:#fff;color:#14161a;border-radius:12px;padding:7px 11px;font-size:13px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.25);word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;transition:opacity .4s}
.bub::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.emo{position:absolute;transform:translate(-50%,-100%);font-size:30px;animation:pop 3.2s ease-out forwards}
@keyframes pop{0%{opacity:0;margin-top:10px}10%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-26px}}
#hud{position:absolute;top:calc(12px + var(--st));left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(14,15,18,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap;color:var(--txt)}
button.chip{cursor:pointer;font:inherit;font-size:13px}
button.chip:hover{border-color:rgba(255,255,255,.25)}
.brand{font-weight:900;letter-spacing:.18em}
.brand b{color:var(--acc)}
#conn{margin-left:auto;font-size:12px;color:var(--sub)}
#conn i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#777;margin-right:6px;vertical-align:1px}
#conn.on i{background:#3ddc84}
#mini{position:absolute;left:12px;bottom:12px;width:200px;height:125px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(14,15,18,.75)}
#emotes{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(14,15,18,.82);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:5px 7px}
#emotes button{all:unset;cursor:pointer;font-size:20px;width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
#emotes button:hover{background:rgba(255,255,255,.1)}
#help{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--sub);background:rgba(14,15,18,.75);padding:6px 10px;border-radius:8px;line-height:1.6}
#joy{position:absolute;left:22px;bottom:calc(86px + var(--sb));width:120px;height:120px;border-radius:50%;background:rgba(14,15,18,.35);border:2px solid rgba(255,255,255,.25);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.75)}
#side{position:fixed;top:0;right:0;bottom:0;width:320px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:66px}
.seg{display:flex;gap:4px;margin:12px 12px 4px;background:#0f1115;border-radius:10px;padding:3px}
.seg button{all:unset;flex:1;text-align:center;cursor:pointer;font-size:13px;padding:7px 0;border-radius:8px;color:var(--sub)}
.seg button.on{background:#262a33;color:#fff;font-weight:700}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.pane.hide{display:none}
.tabs{display:flex;gap:6px;padding:8px 14px}
.tabs button{all:unset;cursor:pointer;font-size:12px;padding:4px 11px;border-radius:999px;color:var(--sub);border:1px solid var(--line)}
.tabs button.on{color:#fff;background:#262a33;border-color:#3a3f4a}
#log{flex:1;overflow:auto;padding:4px 16px 10px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{font-size:13px;line-height:1.5}
.msg .who{font-weight:700;font-size:12px}
.msg .meta{color:var(--sub);font-size:11px;margin-left:6px;font-weight:400}
.msg .body{word-break:break-word;color:#d7dae0}
.sys{font-size:11px;color:var(--sub);text-align:center;padding:6px 0}
#plist{list-style:none;overflow:auto;padding:6px 8px 10px}
#plist li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;font-size:13px}
.dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.pmeta{flex:1;min-width:0}.pmeta div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta small{color:var(--sub);font-size:11px}
.go{all:unset;cursor:pointer;font-size:11px;color:var(--acc);padding:4px 9px;border:1px solid rgba(0,173,239,.35);border-radius:999px}
#cf{position:fixed;right:0;bottom:0;width:320px;display:flex;gap:6px;padding:10px 12px calc(12px + var(--sb));border-top:1px solid var(--line);background:var(--panel);z-index:3}
#ci{flex:1;min-width:0;background:#0f1115;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font:inherit;font-size:14px;outline:none}
#ci:focus{border-color:var(--acc)}
#cf button{all:unset;cursor:pointer;background:var(--acc);color:#001018;font-weight:700;font-size:13px;padding:0 14px;border-radius:10px}
#cf #sheetBtn{display:none}
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;z-index:10;padding:16px}
.modal.hide{display:none}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}
.card .logo{font-weight:900;letter-spacing:.22em;font-size:20px}.card .logo b{color:var(--acc)}
.card h2{font-size:17px}
.card p{color:var(--sub);font-size:13px;margin:8px 0 14px;line-height:1.6}
.card label{display:block;font-size:12px;color:var(--sub);margin:14px 0 6px}
.card input{width:100%;background:#0f1115;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--txt);font:inherit;font-size:16px;outline:none}
.card input:focus{border-color:var(--acc)}
.err{color:#ff7a6b;font-size:12px;margin-top:10px;min-height:1em}
#sw{display:flex;gap:9px;flex-wrap:wrap}
#sw button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;border:2px solid transparent}
#sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--panel) inset}
.btn{all:unset;cursor:pointer;display:block;text-align:center;margin-top:18px;background:var(--acc);color:#001018;font-weight:700;padding:13px;border-radius:12px;width:100%;box-sizing:border-box}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);margin-top:8px}
#qr{display:grid;place-items:center;background:#fff;border-radius:12px;padding:14px;margin:6px auto 12px;width:max-content}
#inviteUrl{font-size:13px;word-break:break-all;background:#0f1115;border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all}
#actBtn{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);display:none;cursor:pointer;background:var(--acc);color:#001018;font:inherit;font-weight:700;font-size:15px;border:0;border-radius:999px;padding:12px 22px;box-shadow:0 6px 20px rgba(0,173,239,.45);animation:breath 1.6s ease-in-out infinite}
#actBtn kbd{font:inherit;font-size:11px;background:rgba(0,0,0,.15);border-radius:5px;padding:1px 6px;margin-left:6px}
@keyframes breath{50%{transform:translateX(-50%) scale(1.05)}}
#toast{position:absolute;top:calc(64px + var(--st));left:50%;transform:translateX(-50%);background:rgba(14,15,18,.9);border:1px solid rgba(255,255,255,.12);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#lapChip{display:none;color:#ffd36b;font-variant-numeric:tabular-nums}
#myPts{font-weight:700}
.act-card{width:min(440px,100%);text-align:center}
.act-card h2{font-size:18px}.act-card .sub{color:var(--sub);font-size:13px;margin:6px 0 14px;line-height:1.55}
.bigtap{all:unset;cursor:pointer;display:block;margin:6px auto;width:210px;height:210px;border-radius:50%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bigtap:active{transform:scale(.96)}
.cnt{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}.cnt small{font-size:15px;color:var(--sub);font-weight:500}
.bar{height:8px;background:#0f1115;border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .15s}
#polishCv{width:100%;max-width:380px;aspect-ratio:2/1;border-radius:14px;touch-action:none;background:#111;display:block;margin:0 auto}
.quiz button{all:unset;cursor:pointer;display:block;text-align:left;background:#0f1115;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14px;line-height:1.45;box-sizing:border-box;width:100%}
.quiz button.ok{border-color:#3ddc84;background:rgba(61,220,132,.12)}.quiz button.no{border-color:#e94b3c;background:rgba(233,75,60,.12)}
.quote{background:#0f1115;border-left:3px solid var(--acc);border-radius:8px;padding:12px 14px;text-align:left;font-size:14px;line-height:1.6;margin-bottom:14px}
.board{padding:6px 14px 14px;overflow:auto;flex:1}
.board h4{font-size:12px;color:var(--sub);margin:14px 0 6px;font-weight:700}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mine div{background:#0f1115;border-radius:10px;padding:9px 6px;text-align:center;font-size:11px;color:var(--sub)}.mine b{display:block;font-size:17px;color:var(--txt)}
.rk{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}.rk .n{width:18px;color:var(--sub);font-size:12px;text-align:right}.rk .v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--sub)}
.wish{font-size:13px;background:#0f1115;border-radius:10px;padding:8px 10px;margin:5px 0;line-height:1.5}.wish b{font-size:12px}
.pt-table{font-size:12px;color:var(--sub);line-height:1.9}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:13px;pointer-events:none}
@media (max-width:760px){
  #stage{inset:0 0 calc(62px + var(--sb)) 0}
  #side{left:0;width:auto;top:auto;height:52%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;bottom:calc(62px + var(--sb));padding-bottom:0;transform:translateY(110%);transition:transform .25s;z-index:4}
  #side.open{transform:none}
  #cf{left:0;width:auto;padding:8px 10px calc(8px + var(--sb))}
  #cf #sheetBtn{display:grid;cursor:pointer;font-size:20px;width:42px;display:grid;place-items:center;background:#262a33;border-radius:10px;position:relative}
  #sheetBtn b{position:absolute;top:-3px;right:-3px;background:#e94b3c;color:#fff;font-size:10px;border-radius:999px;padding:0 5px;display:none}
  #mini,#help{display:none}
  #emotes{left:auto;right:10px;transform:none;flex-direction:column;bottom:12px;border-radius:24px}
  #emotes button{width:40px;height:40px}
  #joy{display:block;bottom:18px}
  #actBtn{bottom:150px;font-size:14px;padding:11px 18px}
  .brand{display:none}
  .chip{padding:6px 11px;font-size:12px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" tabindex="0"></canvas>
  <div id="loading">MB World 불러오는 중…</div>
  <div id="ov"></div>
  <div id="hud">
    <div class="chip brand"><b>MB</b> WORLD</div>
    <div class="chip" id="zone">MB 광장</div>
    <button class="chip" id="editBtn">✏️ 내 정보</button>
    <button class="chip" id="inviteBtn" style="display:none">📱 초대</button>
    <div class="chip" id="myPts" title="정비 포인트 · 연속 출석">🔧 0P</div>
    <div class="chip" id="lapChip">🏁 0.0초</div>
    <div class="chip" id="conn"><i></i><span>연결 중…</span></div>
  </div>
  <div id="toast"></div>
  <button id="actBtn"></button>
  <canvas id="mini" width="400" height="250"></canvas>
  <div id="emotes"></div>
  <div id="joy"><i></i></div>
  <div id="help">WASD·방향키 이동 · 바닥 클릭 이동 · 휠 줌<br>Enter 채팅 · 1~6 리액션</div>
</div>
<aside id="side">
  <div class="seg"><button data-p="chat" class="on">대화</button><button data-p="people">접속자 <span id="cnt">0</span></button><button data-p="board">랭킹</button></div>
  <section class="pane" id="p-chat">
    <div class="tabs"><button data-f="all" class="on">전체</button><button data-f="near">내 근처</button><button data-f="zone">같은 공간</button></div>
    <div id="log"></div>
  </section>
  <section class="pane hide" id="p-people"><ul id="plist"></ul></section>
  <section class="pane hide" id="p-board"><div class="board" id="board"></div></section>
</aside>
<form id="cf" autocomplete="off">
  <button type="button" id="sheetBtn">💬<b id="badge">0</b></button>
  <input id="ci" maxlength="200" placeholder="가볍게 한마디" enterkeyhint="send">
  <button>보내기</button>
</form>

<div id="join" class="modal">
  <div class="card">
    <div id="jHead"><div class="logo"><b>MB</b> WORLD</div><p>서비스매니저 라운지에 오신 걸 환영해요.<br>돌아다니다가 가볍게 인사 나눠보세요.</p></div>
    <label>이름</label><input id="jn" maxlength="16" placeholder="예: 김민수 매니저">
    <label>소속 파트너 · 센터</label><input id="jp" maxlength="24" placeholder="예: 한성모터스 반포">
    <div id="codeWrap" style="display:none"><label>입장 코드</label><input id="jc" maxlength="32" placeholder="안내받은 코드"></div>
    <label>아바타 색</label><div id="sw"></div>
    <div class="err" id="jerr"></div>
    <button class="btn" id="enter">입장하기</button>
    <button class="btn ghost" id="jCancel" style="display:none">취소</button>
  </div>
</div>
<div id="act" class="modal hide"><div class="card act-card" id="actBody"></div></div>
<div id="invite" class="modal hide">
  <div class="card">
    <h2>📱 휴대폰으로 초대하기</h2>
    <p>QR을 찍거나 링크를 보내면 앱 설치 없이 바로 들어올 수 있어요.</p>
    <div id="qr"></div>
    <div id="inviteUrl"></div>
    <div id="inviteCode" class="sys"></div>
    <button class="btn" id="copyBtn">링크 복사</button>
    <button class="btn ghost" id="invClose">닫기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE){$('#loading').textContent='3D 엔진을 불러오지 못했어요. 새로고침해 주세요.';return;}
const W=2400,H=1500,R=14,SPEED=230,NEAR=360,S=1/20,U=v=>v*S;
const MOBILE=matchMedia('(pointer:coarse)').matches||innerWidth<760;
const COLORS=['#00adef','#e94b3c','#f2a531','#3ddc84','#9b6bff','#ff6fb1','#2fd3c6','#c9ced6'];
const EMOTES=['👋','👍','☕','😂','👏','🔥'];
const ZONES=[
  {id:'show',name:'쇼룸',x:120,y:120,w:640,h:420,floor:'#2a2d34',dark:true,sign:'SHOWROOM',door:{side:'s',at:440}},
  {id:'meet',name:'회의실',x:960,y:120,w:480,h:300,floor:'#dfe5ec',sign:'MEETING ROOM',door:{side:'s',at:1200}},
  {id:'lounge',name:'서비스 라운지',x:1640,y:120,w:620,h:420,floor:'#efe8dc',sign:'SERVICE LOUNGE',door:{side:'s',at:1950}},
  {id:'plaza',name:'MB 광장',x:900,y:520,w:600,h:460,open:true},
  {id:'shop',name:'워크숍 베이',x:120,y:940,w:640,h:440,floor:'#9aa0a7',sign:'WORKSHOP',door:{side:'n',at:440}},
  {id:'cafe',name:'MB 카페',x:1640,y:940,w:620,h:440,floor:'#d2ad86',sign:'MB CAFÉ',door:{side:'n',at:1950}},
  {id:'track',name:'테스트 트랙',x:920,y:1100,w:560,h:300,open:true},
];
const clean=(s,n)=>String(s??'').replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g,'').trim().slice(0,n);
const okColor=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#c9ced6';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- collision (2D px space) ---------- */
const RECTS=[],CIRC=[];
const ob=(x,y,w,h)=>RECTS.push({x,y,w,h});
const oc=(x,y,r)=>CIRC.push({x,y,r});
function hits(x,y,r=R){
  if(x<r+16||y<r+16||x>W-r-16||y>H-r-16) return true;
  for(const b of RECTS){const cx=Math.max(b.x,Math.min(x,b.x+b.w)),cy=Math.max(b.y,Math.min(y,b.y+b.h));if((x-cx)**2+(y-cy)**2<r*r) return true;}
  for(const c of CIRC){if((x-c.x)**2+(y-c.y)**2<(r+c.r)**2) return true;}
  return false;
}
const zoneAt=(x,y)=>ZONES.find(z=>x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h)||null;

/* ---------- three setup ---------- */
const cv=$('#cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,MOBILE?1.6:2));
renderer.outputEncoding=THREE.sRGBEncoding;

renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const SKY=new THREE.Color('#bfe0f2');scene.background=SKY;scene.fog=new THREE.Fog(SKY,70,170);
const camera=new THREE.PerspectiveCamera(MOBILE?48:40,1,.5,400);
scene.add(new THREE.HemisphereLight('#eaf4ff','#5f8a4c',.5));
const sun=new THREE.DirectionalLight('#fff1dc',.85);sun.castShadow=true;
sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:1,far:140});sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);

const MC={};
function M(c,o={}){const k=c+JSON.stringify(o);return MC[k]||(MC[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.78,metalness:0,flatShading:true},o)));}
function add(geo,mat,x,y,z,{cast=true,recv=true,parent=scene}={}){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=recv;parent.add(m);return m;}
function B(px,py,pw,pd,h,c,{y0=0,obst=false,o={},cast=true}={}){if(obst)ob(px,py,pw,pd);return add(new THREE.BoxGeometry(U(pw),h,U(pd)),typeof c==='string'?M(c,o):c,U(px+pw/2),y0+h/2,U(py+pd/2),{cast});}
function CY(cx,cy,r,h,c,{y0=0,obst=false,seg=18,o={},rt,cast=true}={}){if(obst)oc(cx,cy,r);return add(new THREE.CylinderGeometry(U(rt??r),U(r),h,seg),typeof c==='string'?M(c,o):c,U(cx),y0+h/2,U(cy),{cast});}

let meAv=null,joined=false,joinedAt=0,target=null,zoomF=MOBILE?1.45:1.4;
const keys=new Set();let joy={x:0,y:0,on:false};
function spawn(){for(let i=0;i<300;i++){const x=980+Math.random()*440,y=880+Math.random()*70;if(!hits(x,y)){me.x=x;me.y=y;return;}}}

/* ---------- networking (two transports) ---------- */
const MODE=(window.claude&&typeof window.claude.use==='function')?'artifact':(/^https?:$/.test(location.protocol)?'ws':'none');
let room=null,db=null,myKey='me-local',myId=null,ws=null,needCode=false,accessCode='',lastSent=0,welcomed=false;
function setConn(on,label){const el=$('#conn');el.classList.toggle('on',!!on);el.querySelector('span').textContent=label||(on?'실시간 연결됨':'연결 중…');}
function stateObj(){return {n:me.n,p:me.p,c:me.c,x:Math.round(me.x),y:Math.round(me.y),h:Math.round(me.h*100)/100,m:me.moving?1:0,e:me.e,et:me.et};}
function push(force){
  if(!joined)return;const now=performance.now();if(!force&&now-lastSent<70)return;lastSent=now;
  if(MODE==='artifact'&&room) room.presence({...stateObj(),id:myId}).catch(()=>{});
  else if(MODE==='ws'&&ws&&ws.readyState===1&&welcomed) ws.send(JSON.stringify({type:'state',...stateObj()}));
}
function upsertPeer(key,s){
  if(!s||typeof s.x!=='number'||!s.n||key===myKey)return;
  let a=AV.get(key);if(!a){a=makeAvatar(key,false);a.x=a.tx=clamp(s.x,0,W);a.y=a.ty=clamp(s.y,0,H);}
  a.tx=clamp(+s.x,0,W);a.ty=clamp(+s.y,0,H);a.th=+s.h||0;
  setLook(a,clean(s.n,16),clean(s.p,24),okColor(s.c));
  if(s.e&&s.et&&s.et!==a.lastEt){if(a.lastEt!==undefined&&Date.now()-s.et<5000)showEmote(key,clean(s.e,4));a.lastEt=s.et;}else if(a.lastEt===undefined)a.lastEt=s.et||0;
  peopleDirty=true;}
let peopleDirty=true;

function initArtifact(){
  (async()=>{
    const C=window.claude;let user=null;
    user=await C.use('user').catch(()=>null);
    if(user){try{myId=await user.id();}catch(e){}try{if(!$('#jn').value){const p=await user.me();if(p&&p.name)$('#jn').value=p.name;}}catch(e){}}
    room=await C.use('room').catch(()=>null);
    if(room){
      room.onConnection(c=>setConn(c),()=>setConn(false,'혼자 둘러보는 중'));
      room.onPeers(ch=>{const seen=new Set();for(const p of ch.peers){if(p.sameTab){if(myKey!==p.peer){const old=myKey;myKey=p.peer;if(meAv&&AV.get(old)===meAv){AV.delete(old);AV.set(myKey,meAv);meAv.key=myKey;}}continue;}seen.add(p.peer);upsertPeer(p.peer,p.presence||{});}
        for(const k of [...AV.keys()])if(k!==myKey&&!seen.has(k))removeAvatar(k);peopleDirty=true;},()=>{});
      room.on('chat',msg=>{const d=msg.data;if(d&&typeof d.t==='string')addMsg({...d,from:msg.peer,_id:'r'+msg.peer+d.ts});},()=>{});
      push(true);
    } else setConn(false,'혼자 둘러보는 중');
    db=await C.use('db').catch(()=>null);
    if(db&&myId){db.doc('scores/'+myId).get().then(s=>statsReady(s.exists?(s.data()||{}).st:null)).catch(()=>statsReady(null));
      db.collection('scores').orderBy('pts','desc').limit(200).onSnapshot(snap=>{board.players=snap.docs.map(d=>{const x=d.data()||{};return {n:clean(x.n,16),p:clean(x.p,24),c:okColor(x.c),pts:+x.pts||0,bolts:+x.bolts||0,best:+x.best||0,streak:+x.streak||0,me:d.id===myId};});
        board.totalBolts=board.players.reduce((a,p)=>a+p.bolts,0);boardChanged();},()=>{});
      db.collection('wishes').orderBy('ts','desc').limit(60).onSnapshot(snap=>{board.wishes=snap.docs.map(d=>{const x=d.data()||{};return {t:clean(x.t,40),n:clean(x.n,16),p:clean(x.p,24),c:okColor(x.c),d:String(x.d||''),ts:+x.ts||0};});boardChanged();},()=>{});
    } else statsReady(null);
    if(db){const timer=setTimeout(()=>sys('이전 대화를 아직 불러오지 못했어요.'),10000);
      db.collection('chat').orderBy('ts','desc').limit(80).onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(timer);
        for(const ch of snap.docChanges()){if(ch.type!=='added')continue;const d=ch.doc.data();if(d)addMsg({...d,from:d.peer,_id:ch.doc.id});}},()=>clearTimeout(timer));}
  })();
}
let retry=0;
function initWS(){
  setConn(false,'연결 중…');
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');}catch(e){setConn(false,'서버 연결 실패');return;}
  ws.onopen=()=>{retry=0;};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==='hello_req'){needCode=!!m.needCode;$('#codeWrap').style.display=needCode?'block':'none';$('#inviteBtn').style.display='';if(joined)sendHello();}
    else if(m.type==='denied'){welcomed=false;if(joined){joined=false;openProfile('join');}$('#jerr').textContent=m.reason==='code'?'입장 코드가 맞지 않아요.':'입장할 수 없어요.';}
    else if(m.type==='welcome'){welcomed=true;const old=myKey;myKey=m.id;if(meAv){AV.delete(old);AV.set(myKey,meAv);meAv.key=myKey;}
      for(const k of [...AV.keys()])if(k!==myKey)removeAvatar(k);
      (m.peers||[]).forEach(p=>upsertPeer(p.id,p));(m.history||[]).forEach(x=>addMsg({...x,_id:x.id}));if(m.board)applyBoard(m.board);statsReady(m.mystats||null);
      setConn(true);$('#join').classList.add('hide');push(true);}
    else if(m.type==='peer') upsertPeer(m.id,m);
    else if(m.type==='leave'){removeAvatar(m.id);peopleDirty=true;}
    else if(m.type==='chat'&&m.m) addMsg({...m.m,_id:m.m.id});
    else if(m.type==='board')applyBoard(m);
    else if(m.type==='notice') sys(clean(m.text,120));
  };
  ws.onclose=()=>{welcomed=false;setConn(false,'다시 연결 중…');for(const k of [...AV.keys()])if(k!==myKey)removeAvatar(k);setTimeout(initWS,Math.min(8000,1000*2**retry++));};
}
function applyBoard(b){board.players=(b.players||[]).map(x=>({n:clean(x.n,16),p:clean(x.p,24),c:okColor(x.c),pts:+x.pts||0,bolts:+x.bolts||0,best:+x.best||0,streak:+x.streak||0,me:x.id===myKey}));
  board.wishes=(b.wishes||[]).map(x=>({t:clean(x.t,40),n:clean(x.n,16),p:clean(x.p,24),c:okColor(x.c),d:String(x.d||''),ts:+x.ts||0}));board.totalBolts=+b.totalBolts||0;boardChanged();}
let token='';try{token=localStorage.getItem('mbworld.token')||'';if(!token){token=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('mbworld.token',token);}}catch(e){token=token||Math.random().toString(36).slice(2)+Date.now().toString(36);}
function sendHello(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'hello',n:me.n,p:me.p,c:me.c,code:accessCode,token,x:Math.round(me.x),y:Math.round(me.y)}));}

/* ---------- chat ---------- */
let msgs=[],filter='all',unread=0;const msgKeys=new Set();
function addMsg(m){
  if(!m||typeof m.t!=='string')return;const key=m._id||(m.from+'|'+m.ts);if(msgKeys.has(key))return;msgKeys.add(key);
  m.t=clean(m.t,200);m.n=clean(m.n,16);m.p=clean(m.p,24);m.c=okColor(m.c);m.x=+m.x||0;m.y=+m.y||0;m.ts=+m.ts||Date.now();
  msgs.push(m);msgs.sort((a,b)=>a.ts-b.ts);if(msgs.length>150)msgs.shift();
  if(m.ts>joinedAt-3000&&joined){if(m.from&&AV.has(m.from))showBubble(m.from,m.t);
    if(MOBILE&&!$('#side').classList.contains('open')&&m.from!==myKey){unread++;const b=$('#badge');b.textContent=unread;b.style.display='block';}}
  renderLog();}
function renderLog(){
  const log=$('#log');const atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<50;log.textContent='';
  const mz=zoneAt(me.x,me.y);
  const list=msgs.filter(m=>filter==='all'||(filter==='near'?Math.hypot(m.x-me.x,m.y-me.y)<NEAR:(zoneAt(m.x,m.y)?.id||'')===(mz?.id||'')));
  if(!list.length){const s=document.createElement('div');s.className='sys';s.textContent=filter==='all'?'아직 대화가 없어요. 먼저 인사해보세요 👋':'이 근처엔 아직 대화가 없어요.';log.append(s);}
  for(const m of list){const d=document.createElement('div');d.className='msg';
    const w=document.createElement('div');w.className='who';w.style.color=m.c;w.textContent=m.n;
    const meta=document.createElement('span');meta.className='meta';const z=zoneAt(m.x,m.y);
    meta.textContent=[m.p,z?z.name:'산책로',new Date(m.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})].filter(Boolean).join(' · ');
    w.append(meta);const b=document.createElement('div');b.className='body';b.textContent=m.t;d.append(w,b);log.append(d);}
  if(atBottom||list.length<6)log.scrollTop=log.scrollHeight;}
function sys(t){const s=document.createElement('div');s.className='sys';s.textContent=t;$('#log').append(s);}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));filter=b.dataset.f;renderLog();});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));for(const p of ['chat','people','board'])$('#p-'+p).classList.toggle('hide',b.dataset.p!==p);if(b.dataset.p==='board')renderBoard();});
$('#sheetBtn').onclick=()=>{const s=$('#side');s.classList.toggle('open');if(s.classList.contains('open')){unread=0;$('#badge').style.display='none';renderLog();}};
let sending=false;
$('#cf').addEventListener('submit',async e=>{
  e.preventDefault();const inp=$('#ci');const t=clean(inp.value,200);if(!t||!joined||sending)return;inp.value='';
  if(MOBILE)inp.blur();
  const m={t,n:me.n,p:me.p,c:me.c,x:Math.round(me.x),y:Math.round(me.y),ts:Date.now()};
  showBubble(myKey,t);
  if(MODE==='ws'){if(ws&&ws.readyState===1&&welcomed)ws.send(JSON.stringify({type:'chat',t}));else sys('연결이 끊겨서 보내지 못했어요.');return;}
  const local={...m,from:myKey,peer:myKey,uid:myId||null};
  if(db){sending=true;try{await db.collection('chat').add({...m,peer:myKey,uid:myId||null});}catch(err){sys(err&&err.code==='quota_exceeded'?'대화 저장 공간이 가득 찼어요.':'저장하지 못해 실시간으로만 전달했어요.');if(room)room.emit('chat',m).catch(()=>addMsg({...local,_id:'l'+m.ts}));else addMsg({...local,_id:'l'+m.ts});}sending=false;}
  else if(room)room.emit('chat',m).catch(()=>addMsg({...local,_id:'l'+m.ts}));
  else addMsg({...local,_id:'l'+m.ts});
});

/* ---------- people list ---------- */
function renderPeople(){
  const ul=$('#plist');ul.textContent='';const all=[...AV.values()].sort((a,b)=>(b.self?1:0)-(a.self?1:0));
  $('#cnt').textContent=all.length;
  for(const a of all){const li=document.createElement('li');
    const d=document.createElement('div');d.className='dot';d.style.background=a.c;d.textContent=(a.n||'?')[0];
    const m=document.createElement('div');m.className='pmeta';const t=document.createElement('div');t.textContent=(a.n||'')+(a.self?' (나)':'');
    const z=document.createElement('small');const zz=zoneAt(a.tx,a.ty);z.textContent=(a.p?a.p+' · ':'')+(zz?zz.name:'산책로');m.append(t,z);li.append(d,m);
    if(!a.self){const b=document.createElement('button');b.className='go';b.textContent='찾아가기';b.onclick=()=>visit(a.key);li.append(b);}
    ul.append(li);}}
function visit(k){const a=AV.get(k);if(!a)return;for(let i=0;i<50;i++){const an=Math.random()*6.28,x=a.tx+Math.cos(an)*48,y=a.ty+Math.sin(an)*48;if(!hits(x,y)){me.x=x;me.y=y;target=null;push(true);if(MOBILE)$('#side').classList.remove('open');return;}}}

/* ---------- input ---------- */
const typing=()=>document.activeElement&&document.activeElement.tagName==='INPUT';
addEventListener('keydown',e=>{
  if(!joined)return;
  if(actOpen){if(e.key==='Escape')closeAct();else if((e.key===' '||e.key==='Enter')&&actOpen.key&&!typing()){e.preventDefault();if(!e.repeat)actOpen.key();}return;}
  if(typing()){if(e.key==='Escape')document.activeElement.blur();return;}
  if(e.key==='Enter'){e.preventDefault();$('#ci').focus();return;}
  if(e.key.toLowerCase()==='e'&&nearSpot){openAct(nearSpot.id);return;}
  const n=parseInt(e.key,10);if(n>=1&&n<=EMOTES.length){emote(EMOTES[n-1]);return;}
  const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){keys.add(k);target=null;e.preventDefault();}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
const ptrs=new Map();let pinch0=0,zoom0=1;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hitV=new THREE.Vector3();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture?.(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=zoomF;}if(typing())document.activeElement.blur();});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];zoomF=clamp(zoom0*pinch0/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),.7,2.2);}});
const endPtr=e=>{const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(!p||!joined)return;if(ptrs.size===0&&pinch0){pinch0=0;return;}
  if(Math.hypot(p.x-p.sx,p.y-p.sy)<10&&!pinch0){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
    ray.setFromCamera(ndc,camera);if(ray.ray.intersectPlane(plane,hitV)){target={x:hitV.x/S,y:hitV.z/S};}}};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomF=clamp(zoomF*(e.deltaY>0?1.08:.93),.7,2.2);},{passive:false});
const joyEl=$('#joy'),knob=joyEl.querySelector('i');
const joyMove=e=>{const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy),mx=r.width/2-14;if(l>mx){dx*=mx/l;dy*=mx/l;}
  joy={x:dx/mx,y:dy/mx,on:true};knob.style.transform=`translate(${dx}px,${dy}px)`;target=null;};
joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);joyMove(e);});
joyEl.addEventListener('pointermove',e=>{if(joy.on)joyMove(e);});
const joyEnd=()=>{joy={x:0,y:0,on:false};knob.style.transform='';};joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
const emoBar=$('#emotes');EMOTES.forEach((x,i)=>{const b=document.createElement('button');b.title='리액션 '+(i+1);b.textContent=x;b.onclick=()=>emote(x);emoBar.append(b);});

try{const s=JSON.parse(localStorage.getItem('mbworld.me')||'null');if(s){$('#jn').value=s.n||'';$('#jp').value=s.p||'';if(COLORS.includes(s.c))pick=s.c;accessCode=s.code||'';$('#jc').value=accessCode;}}catch(e){}

const kst=(o=0)=>new Date(Date.now()+9*3600e3+o).toISOString().slice(0,10);
const today=()=>kst(0),yesterday=()=>kst(-864e5),dayNum=()=>Math.floor((Date.now()+9*3600e3)/864e5);
const DEF_ST=()=>({pts:0,bolts:0,set:0,best:0,streak:0,last:'',days:0,day:{d:'',polish:0,coffee:0,laps:0,quiz:0,wish:0}});
let st=DEF_ST(),stLoaded=false,board={players:[],wishes:[],totalBolts:0};
function normSt(s){const d=DEF_ST();if(!s||typeof s!=='object')return d;const n=(v,mx=1e9)=>Math.max(0,Math.min(mx,Math.floor(+v||0)));
  const o={pts:n(s.pts),bolts:n(s.bolts),set:n(s.set,107),best:n(s.best,36e5),streak:n(s.streak,9999),last:typeof s.last==='string'?s.last.slice(0,10):'',days:n(s.days,99999),day:{...d.day}};

  const mine=el('div','mine');const a=el('div');a.append(el('b',null,fmtT(st.best)),document.createTextNode('내 최고 기록'));const c2=el('div');c2.append(el('b',null,String(st.day.laps)),document.createTextNode('오늘 완주'));const c3=el('div');c3.append(el('b',null,String(Math.max(0,5-st.day.laps))),document.createTextNode('포인트 남은 판'));
  mine.append(a,c2,c3);b.append(mine);const h=el('h4',null,'🏆 랩타임 TOP 5');h.style.cssText='text-align:left;margin:16px 0 4px;font-size:12px;color:var(--sub)';b.append(h);
  const list=el('div');b.append(list);
  const top=board.players.filter(p=>p.best>0).sort((x,y)=>x.best-y.best).slice(0,5);if(!top.length)list.append(el('div','sys','아직 기록이 없어요. 첫 기록의 주인공이 되어보세요!'));
  top.forEach((p,i)=>list.append(rankRow(i+1,p,fmtT(p.best))));
  const go=el('button','btn','도전하러 가기');go.onclick=closeAct;b.append(go);}
function actWish(){
  const b=actShell('🪙 분수에 오늘의 다짐',st.day.wish?'오늘의 다짐을 이미 던졌어요. 내일 또 만나요!':'동전과 함께 오늘의 다짐을 남겨요. 모두에게 보여요. <b>+3P</b>');
  if(!st.day.wish){const inp=el('input');inp.maxLength=40;inp.placeholder='예: 오늘 출고 고객 모두에게 먼저 인사하기';inp.style.cssText='width:100%;background:#0f1115;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--txt);font:inherit;font-size:16px;outline:none';
    const go=el('button','btn','🪙 동전 던지기');b.append(inp,go);
    const send=()=>{const t=clean(inp.value,40);if(!t){inp.focus();return;}st.day.wish=1;sendWish(t);chime();emote('🪙');gain(3,'오늘의 다짐');actWish();};
    go.onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});setTimeout(()=>{if(!MOBILE)inp.focus();},50);}
  const h=el('h4',null,'오늘 모두의 다짐');h.style.cssText='text-align:left;margin:16px 0 4px;font-size:12px;color:var(--sub)';b.append(h);
  const wall=el('div');wall.style.cssText='max-height:220px;overflow:auto;text-align:left';b.append(wall);fillWishes(wall);
  actOpen.refresh=()=>{wall.textContent='';fillWishes(wall);};closeBtn(b);}
function fillWishes(wall){const ws_=board.wishes.filter(w=>w.d===today());if(!ws_.length){wall.append(el('div','sys','아직 오늘의 다짐이 없어요.'));return;}
  for(const w of ws_){const d=el('div','wish');const n=el('b',null,w.n+(w.p?' · '+w.p:''));n.style.color=okColor(w.c);d.append(n,el('div',null,w.t));wall.append(d);}}
function sendWish(t){const w={t,n:me.n,p:me.p,c:me.c,d:today(),ts:Date.now()};
  if(MODE==='ws'){if(ws&&ws.readyState===1&&welcomed)ws.send(JSON.stringify({type:'wish',t}));}
  else if(db&&myId){db.doc('wishes/'+myId).set(w).catch(()=>{});}
  if(!(MODE==='ws')&&!(db&&myId)){board.wishes.unshift(w);boardChanged();}}
function rankRow(i,p,v){const r=el('div','rk');r.append(el('span','n',String(i)));const d=el('span','dot');d.style.cssText=`background:${okColor(p.c)};width:20px;height:20px;font-size:10px`;d.textContent=(p.n||'?')[0];
  const nm=el('span',null,(p.n||'?')+(p.me?' (나)':''));nm.style.cssText='white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0';r.append(d,nm);if(p.p){const s=el('small',null,p.p);s.style.cssText='color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0';r.append(s);}r.append(el('span','v',v));return r;}
function renderBoard(){
  const b=$('#board');b.textContent='';b.append(el('h4',null,'내 기록'));
  const mine=el('div','mine');for(const [v,l] of [[st.pts.toLocaleString()+'P','정비 포인트'],['🔥'+st.streak+'일','연속 출석'],[st.bolts.toLocaleString(),'조인 볼트']]){const d=el('div');d.append(el('b',null,v),document.createTextNode(l));mine.append(d);}b.append(mine);
  const tb=el('div','sys','🔧 모두 함께 조인 볼트 '+Math.max(board.totalBolts,st.bolts).toLocaleString()+'개');tb.style.marginTop='8px';b.append(tb);
  b.append(el('h4',null,'🏆 정비 포인트 TOP 10'));const top=[...board.players].sort((x,y)=>y.pts-x.pts).slice(0,10);
  if(!top.length)b.append(el('div','sys','아직 기록이 없어요'));top.forEach((p,i)=>b.append(rankRow(i+1,p,(p.pts||0).toLocaleString()+'P')));
  b.append(el('h4',null,'🏁 랩타임 TOP 5'));const lt=board.players.filter(p=>p.best>0).sort((x,y)=>x.best-y.best).slice(0,5);
  if(!lt.length)b.append(el('div','sys','테스트 트랙에서 첫 기록을 세워보세요'));lt.forEach((p,i)=>b.append(rankRow(i+1,p,fmtT(p.best))));
  b.append(el('h4',null,'🪙 오늘의 다짐'));const w=el('div');fillWishes(w);b.append(w);
  b.append(el('h4',null,'포인트 얻는 법'));const t=el('div','pt-table');
  t.textContent='출석 +2 (연속 출석 🔥) · 볼트 108회 +10 · 광택 +5 (하루 3번)\n응대 수행 정답 +5 (하루 1문제) · 다짐 +3 · 랩 완주 +3 · 신기록 +5 · 커피 +1 (하루 3잔)';t.style.whiteSpace='pre-line';b.append(t);}

const lap={run:false,t0:0,cp:0,inS:false};
function lapTick(now){
  const inS=me.x>1178&&me.x<1222&&me.y>1105&&me.y<1188;
  if(inS&&!lap.inS){if(lap.run&&lap.cp===7)finishLap(now-lap.t0);lap.run=true;lap.t0=now;lap.cp=0;}
  lap.inS=inS;
  if(lap.run){if(me.x>1410)lap.cp|=1;if(me.y>1325)lap.cp|=2;if(me.x<990)lap.cp|=4;
    const dx=(me.x-1200)/292,dy=(me.y-1250)/158;if(dx*dx+dy*dy>1.12||now-lap.t0>180000)lap.run=false;}
  const chip=$('#lapChip');chip.style.display=lap.run?'':'none';if(lap.run)chip.textContent='🏁 '+((now-lap.t0)/1000).toFixed(1)+'초';}
function finishLap(ms){if(!stLoaded||ms<2500)return;dayRoll();st.day.laps++;const rec=!st.best||ms<st.best;const prev=st.best;if(rec)st.best=ms;
  chime();emote('🏁');let p=0;if(st.day.laps<=5)p+=3;if(rec&&prev)p+=5;
  if(p)gain(p,(rec?(prev?'🏆 신기록! ':'첫 기록! '):'완주! ')+fmtT(ms));else{toast('완주! '+fmtT(ms));saveSt();}}

/* ---------- loop ---------- */
const mini=$('#mini'),mctx=mini.getContext('2d');
let last=performance.now(),tt=0,peopleT=0;const camPos=new THREE.Vector3(U(1200),20,U(1200)),look=new THREE.Vector3(),pv=new THREE.Vector3();
function resize(){const r=cv.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();}
addEventListener('resize',resize);new ResizeObserver(resize).observe(cv);
const angLerp=(a,b,k)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k;};
function step(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
  if(joined){
    let vx=0,vy=0;
    if(keys.has('arrowleft')||keys.has('a'))vx--;if(keys.has('arrowright')||keys.has('d'))vx++;if(keys.has('arrowup')||keys.has('w'))vy--;if(keys.has('arrowdown')||keys.has('s'))vy++;
    if(joy.on&&Math.hypot(joy.x,joy.y)>.15){vx=joy.x;vy=joy.y;}
    if(!vx&&!vy&&target){const dx=target.x-me.x,dy=target.y-me.y,l=Math.hypot(dx,dy);if(l<6)target=null;else{vx=dx/l;vy=dy/l;}}
    const l=Math.hypot(vx,vy),was=me.moving;me.moving=l>0;
    if(l){const sp=SPEED*Math.min(1,l);vx/=l;vy/=l;const nx=me.x+vx*sp*dt,ny=me.y+vy*sp*dt;let mv=false;
      if(!hits(nx,me.y)){me.x=nx;mv=true;}if(!hits(me.x,ny)){me.y=ny;mv=true;}if(!mv&&target)target=null;
      me.h=Math.atan2(vx,vy);push(false);}else if(was)push(true);
    meAv.tx=me.x;meAv.ty=me.y;meAv.th=me.h;meAv.x=me.x;meAv.y=me.y;meAv.moving=me.moving;
    lapTick(now);
    let ns=null;for(const s of SPOTS){if(Math.hypot(s.x-me.x,s.y-me.y)<75){ns=s;break;}}
    if(ns!==nearSpot){nearSpot=ns;const ab=$('#actBtn');if(ns){ab.innerHTML='';ab.append(document.createTextNode(ns.icon+' '+ns.label));if(!MOBILE){const k=document.createElement('kbd');k.textContent='E';ab.append(k);}ab.style.display='block';}else ab.style.display='none';}
    const z=zoneAt(me.x,me.y),zn=z?z.name:'MB 월드 산책로';if($('#zone').textContent!==zn){$('#zone').textContent=zn;if(filter!=='all')renderLog();}
  }
  for(const a of AV.values()){
    if(!a.self){const k=Math.min(1,dt*10),dx=a.tx-a.x,dy=a.ty-a.y;a.x+=dx*k;a.y+=dy*k;a.moving=Math.hypot(dx,dy)>1.5;}
    a.h=angLerp(a.h,a.th,Math.min(1,dt*12));
    a.g.position.set(U(a.x),0,U(a.y));a.g.rotation.y=a.h;
    if(a.moving)a.phase+=dt*11;const sw=a.moving?Math.sin(a.phase)*.7:0;
    a.legs[0].rotation.x=sw;a.legs[1].rotation.x=-sw;a.arms[0].rotation.x=-sw*.8;a.arms[1].rotation.x=sw*.8;
    a.body.position.y=.98+(a.moving?Math.abs(Math.sin(a.phase))*.07:0);
  }
  for(const s of SPOTS){if(s.sp){s.sp.visible=s!==nearSpot;s.sp.position.y=3.3+Math.sin(tt*2+s.x)*.18;s.ring.scale.setScalar(1+Math.sin(tt*3+s.y)*.06);}}
  if(trackCar){const an=tt*.55,x=1200+Math.cos(an)*238,y=1250+Math.sin(an)*105;trackCar.position.set(U(x),0,U(y));trackCar.rotation.y=-Math.atan2(Math.cos(an)*105,-Math.sin(an)*238);}
  if(fountainJet){fountainJet.scale.y=1+Math.sin(tt*4)*.12;fRings.forEach((r,i)=>{const p=((tt*.5+i/3)%1);const s=U(20+p*52);r.scale.set(s,s,s);r.material.opacity=.55*(1-p);});}
  // camera
  const fx=meAv?U(meAv.x):U(1200),fz=meAv?U(meAv.y):U(860);
  const want=new THREE.Vector3(fx,16*zoomF,fz+15*zoomF);camPos.lerp(want,1-Math.exp(-dt*5));camera.position.copy(camPos);
  look.set(fx,.8,fz);camera.lookAt(camPos.x,look.y,camPos.z-15*zoomF);
  sun.position.set(fx-22,34,fz+14);sun.target.position.set(fx,0,fz);
  renderer.render(scene,camera);
  // overlays
  const rw=cv.clientWidth,rh=cv.clientHeight;
  for(const a of AV.values()){
    pv.set(U(a.x),2.85,U(a.y)).project(camera);const vis=pv.z<1&&pv.x>-1.2&&pv.x<1.2&&pv.y>-1.2&&pv.y<1.3;
    const sx=(pv.x+1)/2*rw,sy=(1-pv.y)/2*rh;
    a.tag.style.display=vis?'':'none';if(vis)a.tag.style.transform=`translate(${sx}px,${sy}px) translate(-50%,-100%)`;a.tag.style.left='0';a.tag.style.top='0';
    if(a.bub){const age=now-a.bubT;if(age>7000){a.bub.remove();a.bub=null;}else{a.bub.style.display=vis?'':'none';a.bub.style.left='0';a.bub.style.top='0';a.bub.style.transform=`translate(${sx}px,${sy-(a.tag.offsetHeight+8)}px) translate(-50%,-100%)`;if(age>6200)a.bub.style.opacity=0;}}
    if(a.emo){a.emo.style.left=(sx+34)+'px';a.emo.style.top=(sy-4)+'px';}
  }
  if(now-peopleT>800&&peopleDirty){peopleT=now;peopleDirty=false;renderPeople();}
  if(!MOBILE)drawMini();
  requestAnimationFrame(step);
}
function drawMini(){
  const sx=mini.width/W,sy=mini.height/H;mctx.clearRect(0,0,mini.width,mini.height);mctx.fillStyle='rgba(134,179,111,.35)';mctx.fillRect(0,0,mini.width,mini.height);
  for(const z of ZONES){mctx.fillStyle=z.id==='track'?'rgba(58,61,66,.9)':z.open?'rgba(220,216,208,.6)':'rgba(233,235,239,.55)';
    if(z.id==='track'){mctx.beginPath();mctx.ellipse(1200*sx,1250*sy,275*sx,140*sy,0,0,7);mctx.fill();}else mctx.fillRect(z.x*sx,z.y*sy,z.w*sx,z.h*sy);}
  for(const a of AV.values()){if(a.self)continue;mctx.fillStyle=a.c||'#ccc';mctx.beginPath();mctx.arc(a.x*sx,a.y*sy,5,0,7);mctx.fill();}
  if(joined){mctx.fillStyle='#fff';mctx.beginPath();mctx.arc(me.x*sx,me.y*sy,8,0,7);mctx.fill();mctx.fillStyle=me.c;mctx.beginPath();mctx.arc(me.x*sx,me.y*sy,5.5,0,7);mctx.fill();}}

/* ---------- boot ---------- */
resize();
let built=false;const build=()=>{if(built)return;built=true;buildWorld();buildSpots();$('#loading').remove();};
Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(build);
requestAnimationFrame(step);
if(MODE==='artifact')initArtifact();else if(MODE==='ws')initWS();else{setConn(false,'혼자 둘러보는 중');statsReady(null);}
renderLog();
if(/[?&]debug\b/.test(location.search))window.__mb={me,openAct,get st(){return st;}};
})();
</script>
